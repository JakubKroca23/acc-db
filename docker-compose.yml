# Kalkulačka příslušenství — https://zakazky.contsystem.cz/acc-db/
#
# Deploy:
#   docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acc-db-app
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Přístup jen pro přihlášené v Contsystem Manageru s rolí (Appwrite label) z ACC_DB_ALLOWED_ROLES.
      # Vypnutí (nouzově): ACC_DB_AUTH=off v .env a `docker compose up -d`.
      - ACC_DB_AUTH=${ACC_DB_AUTH:-manager}
      - ACC_DB_ALLOWED_ROLES=${ACC_DB_ALLOWED_ROLES:-dev}
      - MANAGER_APPWRITE_ENDPOINT=${MANAGER_APPWRITE_ENDPOINT:-https://appwrite.propoj.app/v1}
      - MANAGER_APPWRITE_PROJECT_ID=${MANAGER_APPWRITE_PROJECT_ID:-contsystem}
      # AI asistent: Ollama v kontejneru `ollama` na sdílené docker síti `ollama` (port není veřejný)
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      # GroqCloud: GROQ_API_KEY přichází jen z .env na serveru (env_file výše) — nikdy do gitu ani do frontendu.
      # První dostupný model ze seznamu je výchozí v panelu Kapitána Karla.
      - GROQ_MODELS=${GROQ_MODELS:-openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.acc-db.rule=Host(`zakazky.contsystem.cz`) && PathPrefix(`/acc-db`)"
      - "traefik.http.routers.acc-db.priority=100"
      - "traefik.http.routers.acc-db.tls=true"
      - "traefik.http.routers.acc-db.tls.certresolver=letsencrypt"
      - "traefik.http.routers.acc-db.tls.domains[0].main=zakazky.contsystem.cz"
      - "traefik.http.routers.acc-db.service=acc-db"
      - "traefik.http.services.acc-db.loadbalancer.server.port=4173"
      - "traefik.docker.network=appwrite"
    networks:
      - appwrite
      - ollama

networks:
  appwrite:
    external: true
  # `docker network create ollama && docker network connect ollama ollama` (viz README → AI asistent)
  ollama:
    external: true
