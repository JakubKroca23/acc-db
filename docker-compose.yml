# Kalkulačka příslušenství — https://zakazky.contsystem.cz/acc-db/
#
# Deploy:
#   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: acc-db-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-acc_db}
    ports:
      - "127.0.0.1:54331:5432"
    volumes:
      - acc-db-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - acc-db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acc-db-app
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Discrete PG config — heslo smí obsahovat ?, @, # (neprochází URL parserem).
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-acc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-acc_db}
      # Volitelně; při speciálních znacích v hesle raději spoléhejte na POSTGRES_* výše.
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-acc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acc_db}}
      # Přístup jen pro přihlášené v Contsystem Manageru s rolí (Appwrite label) z ACC_DB_ALLOWED_ROLES.
      # Vypnutí (nouzově): ACC_DB_AUTH=off v .env a `docker compose up -d`.
      - ACC_DB_AUTH=${ACC_DB_AUTH:-manager}
      - ACC_DB_ALLOWED_ROLES=${ACC_DB_ALLOWED_ROLES:-*}
      - MANAGER_APPWRITE_ENDPOINT=${MANAGER_APPWRITE_ENDPOINT:-https://appwrite.propoj.app/v1}
      - MANAGER_APPWRITE_PROJECT_ID=${MANAGER_APPWRITE_PROJECT_ID:-contsystem}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.acc-db.rule=Host(`zakazky.contsystem.cz`) && PathPrefix(`/acc-db`)"
      - "traefik.http.routers.acc-db.priority=100"
      - "traefik.http.routers.acc-db.tls=true"
      - "traefik.http.routers.acc-db.tls.certresolver=letsencrypt"
      - "traefik.http.routers.acc-db.tls.domains[0].main=zakazky.contsystem.cz"
      - "traefik.http.routers.acc-db.service=acc-db"
      - "traefik.http.services.acc-db.loadbalancer.server.port=4173"
      - "traefik.docker.network=appwrite"
    networks:
      - appwrite
      - acc-db

volumes:
  acc-db-pg:

networks:
  appwrite:
    external: true
  acc-db:
    name: acc-db
